<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>4コマ漫画 | さとモンと仲間たち</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
.tabs{display:flex;gap:8px;margin:12px 0 8px;flex-wrap:wrap}
.tab,.btn{border:2px solid var(--line);background:var(--paper);color:var(--ink);font:inherit;padding:5px 18px;border-radius:99px;cursor:pointer}
.tab[aria-pressed=true]{background:var(--leaf);border-color:var(--leaf);color:#fff;font-weight:700}
.btn:hover:not(:disabled){border-color:var(--leaf)}.btn:disabled{opacity:.35;cursor:default}
.btn:focus-visible{outline:3px solid var(--leaf);outline-offset:2px}
.info{color:var(--sub);font-size:.88rem;margin:0 0 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.it{border:2px solid var(--line);background:var(--paper);border-radius:14px;overflow:hidden;padding:0;cursor:pointer;font:inherit;color:inherit;text-align:center}
.it:hover{border-color:var(--leaf)}.it:focus-visible{outline:3px solid var(--leaf)}
.it .pic{aspect-ratio:3/4}.it .pic img{object-position:top}
.it b{display:block;font-size:.82rem;padding:3px 0 5px}
.new{background:var(--sakura);border-radius:99px;padding:0 10px;font-size:.75rem;color:var(--ink)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:6px 0 14px}
.bar h3{margin:0;font-size:1.05rem}
#im{display:block;margin:0 auto;max-width:100%;max-height:calc(100vh - 190px);width:auto;height:auto;border-radius:10px;box-shadow:0 4px 0 var(--line);background:var(--paper);min-height:200px;touch-action:pan-y}
.nv{display:flex;justify-content:center;gap:12px;margin-top:16px}
</style></head><body>
<main>
<h2>4コマ漫画</h2>
<div class="tabs" role="group" aria-label="種類"><button class="tab" data-k="n">本編</button><button class="tab" data-k="s">特別編</button></div>
<section id="list"><p class="info"><span id="cnt"></span><button class="btn" id="last">最新話を読む</button></p><div class="grid" id="g"></div></section>
<section id="view" hidden>
<div class="bar"><button class="btn" id="back">一覧へ</button><h3 id="ttl"></h3><span></span></div>
<img id="im" alt="">
<div class="nv"><button class="btn" id="pv"></button><button class="btn" id="nx"></button></div>
</section>
</main>
<script>
// 画像が取得できた枚数までを自動で数えます。未確認の分は KNOWN を超えた所から1枚ずつ確認します。
var K={n:{dir:"assets/comic/",known:72,lab:function(n){return"第"+n+"話"},pv:"← 前の話",nx:"次の話 →",unit:"話"},
       s:{dir:"assets/special/",known:21,lab:function(n){return"特別編 "+n+"/"+N.s},pv:"前のページ →",nx:"← 次のページ",unit:"ページ"}};
var N={n:0,s:0},cur="n",ep=0,$=function(i){return document.getElementById(i)};
function pad(n){return("00"+n).slice(-3)}
function src(k,n){return K[k].dir+pad(n)+"."+(K[k].ext||"png")}
function has(u){return new Promise(function(r){var i=new Image();i.onload=function(){r(1)};i.onerror=function(){r(0)};i.src=u})}
// 画像の形式は webp / jpg / png のどれでも使えます（001 の画像で判定します。同じ種類の中では形式をそろえてください）
async function detect(k){var e=["webp","jpg","png"];for(var i=0;i<e.length;i++){if(await has(K[k].dir+"001."+e[i])){K[k].ext=e[i];return}}K[k].ext="png"}
async function count(k){var n=K[k].known;while(await has(src(k,n+1)))n++;return n}
function grid(){var k=cur,h="";for(var n=1;n<=N[k];n++)h+='<button class="it" data-n="'+n+'"><div class="pic"><span>📖</span><img loading="lazy" src="'+K[k].dir+'thumb/'+pad(n)+'.jpg" alt="" onerror="if(!this.dataset.f){this.dataset.f=1;this.src=\''+src(k,n)+'\'}else this.remove()"></div><b>'+(k=="n"?"第"+n+"話":n+"ページ")+(k=="n"&&n==N.n&&n>K.n.known?' <span class="new">NEW</span>':'')+'</b></button>';
 $("g").innerHTML=h;$("cnt").textContent=k=="n"?"全"+N.n+"話（連載中）":"全"+N.s+"ページ（右から左へ読みます）";$("last").hidden=k!="n"||!N.n;
 document.querySelectorAll(".tab").forEach(function(b){b.setAttribute("aria-pressed",b.dataset.k==k)})}
function show(k,n){cur=k;ep=n;$("list").hidden=true;$("view").hidden=false;
 $("im").src=src(k,n);$("im").alt=K[k].lab(n);$("ttl").textContent=K[k].lab(n);
 $("pv").textContent=K[k].pv;document.querySelector(".nv").style.flexDirection=k=="s"?"row-reverse":"row";$("nx").textContent=K[k].nx;$("pv").disabled=n<=1;$("nx").disabled=n>=N[k];
 [n-1,n+1].forEach(function(m){if(m>=1&&m<=N[k])(new Image()).src=src(k,m)});
 history.replaceState(null,"","#"+k+n);scrollTo(0,0)}
function list(k){cur=k;$("view").hidden=true;$("list").hidden=false;grid();history.replaceState(null,"","#"+k)}
function go(d){var m=ep+d;if(m>=1&&m<=N[cur])show(cur,m)}
$("g").onclick=function(e){var b=e.target.closest(".it");if(b)show(cur,+b.dataset.n)};
document.querySelector(".tabs").onclick=function(e){var b=e.target.closest(".tab");if(b)list(b.dataset.k)};
$("last").onclick=function(){show("n",N.n)};$("back").onclick=function(){list(cur)};
$("pv").onclick=function(){go(-1)};$("nx").onclick=function(){go(1)};
document.onkeydown=function(e){if($("view").hidden)return;var r=cur=="s";if(e.key=="ArrowLeft")go(r?1:-1);if(e.key=="ArrowRight")go(r?-1:1)};
var x0=0;$("im").ontouchstart=function(e){x0=e.touches[0].clientX};
$("im").ontouchend=function(e){var d=e.changedTouches[0].clientX-x0;if(Math.abs(d)>60)go((d<0)!=(cur=="s")?1:-1)};
(async function(){await detect("n");await detect("s");N.n=await count("n");N.s=await count("s");
 var m=/^#([ns])(\d+)?$/.exec(location.hash);
 if(m&&m[2]&&+m[2]>=1&&+m[2]<=N[m[1]])show(m[1],+m[2]);else list(m?m[1]:"n")})();
</script>
<script src="site-config.js"></script>
<script src="common.js"></script></body></html>
