<script>
// オープニング動画：ブラウザを開いて最初の1回だけ流します（#intro を付けると再生）
(function(){var el=document.getElementById("intro");if(!el)return;
var seen=false;try{seen=sessionStorage.getItem("intro")=="1"}catch(e){}
if(/^#intro/.test(location.hash))seen=false;
if(seen||matchMedia("(prefers-reduced-motion:reduce)").matches){el.remove();return}
var v=el.querySelector("video");document.body.style.overflow="hidden";document.documentElement.classList.add("ip");
function end(){document.documentElement.classList.remove("ip");try{sessionStorage.setItem("intro","1")}catch(e){}v.pause();el.classList.add("off");document.body.style.overflow="";setTimeout(function(){el.remove()},900)}
v.addEventListener("ended",end);v.addEventListener("error",end);
document.getElementById("skip").onclick=end;
// 十分に読み込めてから再生を始める（読み込み途中の再生は、カクつきの原因になります）。遅い回線でも4秒後には始めます。
if(/debug/.test(location.hash)){var dg=document.createElement("pre"),n=0,t0=0,fps="-";dg.style.cssText="position:absolute;left:8px;top:8px;margin:0;padding:6px 10px;background:#000a;color:#0f0;font:12px monospace;z-index:2";el.appendChild(dg);
if(v.requestVideoFrameCallback){(function cb(now){n++;if(!t0)t0=now;if(now-t0>=1000){fps=(n*1000/(now-t0)).toFixed(1);n=0;t0=now}v.requestVideoFrameCallback(cb)})(0)}
setInterval(function(){var q=v.getVideoPlaybackQuality?v.getVideoPlaybackQuality():{},b=v.buffered.length?v.buffered.end(v.buffered.length-1).toFixed(1):0;
dg.textContent=v.videoWidth+"x"+v.videoHeight+"  t="+v.currentTime.toFixed(1)+"s\nframes: "+q.totalVideoFrames+"  dropped: "+q.droppedVideoFrames+"\nshown fps: "+fps+"  buffered: "+b+"s"},500)}
var started=false;function go(){if(started)return;started=true;var p=v.play();if(p&&p.catch)p.catch(end)}
v.addEventListener("canplaythrough",go);setTimeout(go,4000);if(v.readyState>=4)go();
})();
</script>
